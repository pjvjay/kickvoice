[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kickvoice"
dynamic = ["version"]
description = "Speaker identification, transcription, opposition research and an MCP agent copilot for Kick.com live streams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kickvoice contributors" }]
requires-python = ">=3.10"
keywords = ["speaker-recognition", "diarization", "ecapa-tdnn", "whisper", "mcp", "agents", "livestream", "kick"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
    "streamlink>=6.0",
    "torch>=2.2",
    "speechbrain>=1.0",
    "silero-vad>=5.1",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.0"]
transcribe = ["faster-whisper>=1.0"]
agent = ["mcp>=2.3,<3"]
all = ["kickvoice[youtube,transcribe,agent]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
kickvoice = "kickvoice.cli:main"

[project.urls]
Documentation = "https://github.com/kickvoice/kickvoice#readme"
Changelog = "https://github.com/kickvoice/kickvoice/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "kickvoice.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kickvoice = ["py.typed"]

# ── tests & coverage ─────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: takes several seconds (live sessions, subprocess MCP servers)",
]
filterwarnings = [
    "ignore::DeprecationWarning:speechbrain.*",
    "ignore::DeprecationWarning:torchaudio.*",
]

[tool.coverage.run]
source = ["kickvoice"]
branch = true
# Agent tests spawn real MCP servers (`kickvoice mcp`) as subprocesses;
# measure those too.
parallel = true
patch = ["subprocess"]
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

# ── lint ─────────────────────────────────────────────────────────

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # long lines: prose in help/docstrings
    "B008",    # click/pydantic defaults in signatures
    "SIM108",  # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
