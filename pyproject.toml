[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kickvoice"
version = "0.1.0"
description = "Speaker identification on Kick.com live streams"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "torch>=2.2",
    "torchaudio>=2.2",
    "speechbrain>=1.0",
    "silero-vad>=5.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "streamlink>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.0"]
transcribe = ["faster-whisper>=1.0"]
agent = ["mcp>=2.0"]
dev = ["pytest", "pytest-cov"]

[project.scripts]
kickvoice = "kickvoice.cli:main"

[tool.setuptools.packages.find]
include = ["kickvoice*"]
